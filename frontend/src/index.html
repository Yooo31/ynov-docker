<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8" />
    <title>Status Docker</title>
</head>
<body>

<pre id="status">
frontend : up
backend  : checking...
server   : checking...
</pre>

<script>
    const statusEl = document.getElementById("status");

    function setLine(name, value) {
        const lines = statusEl.innerText.split("\n");
        const index = lines.findIndex(l => l.startsWith(name));
        lines[index] = `${name} : ${value}`;
        statusEl.innerText = lines.join("\n");
    }

    setLine("frontend", "up");

    async function checkBackend() {
        try {
            const res = await fetch("/api/health");
            if (!res.ok) throw new Error();
            setLine("backend ", "up");
        } catch {
            setLine("backend ", "down");
        }
    }

    async function checkServer() {
        try {
            const res = await fetch("/game/health");
            if (!res.ok) throw new Error();
            setLine("server  ", "up");
        } catch {
            setLine("server  ", "down");
        }
    }

    checkBackend();
    checkServer();

    setInterval(checkBackend, 30000);
    setInterval(checkServer, 30000);
</script>

</body>
</html>
